# YOLOv8 detector config — zero-shot variant (T3).
#
# T4 (fine-tune) will introduce a sibling config; for now this file
# drives `tracking detect --config configs/detector_yolov8.yaml`.

detector:
  weights: yolov8m.pt   # COCO-pretrained; ultralytics downloads to cwd on first call
  imgsz: 1280           # KITTI's small distant objects need it; speed cost acceptable
  val_conf: 0.001       # mAP needs the full PR curve
  dump_conf: 0.1        # MOT dumps; preserves ByteTrack low-conf differentiator
  iou: 0.5
  classes: [0, 2]       # COCO person, car — model-level filter
  device: ""            # auto-detect (cuda if available, else cpu)

dataset:
  root: data/kitti_tracking
  val_sequences: ["0001", "0006", "0013", "0017", "0019"]
  yolo_eval_dir: data/yolo_kitti

output:
  det_dir: runs/det/yolov8m_zeroshot
  format: mot16

seed: 42
