[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracking"
version = "0.1.0"
description = "Multi-object tracking on KITTI MOT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zargham" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "opencv-python>=4.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "filterpy>=1.4.5",
    "scipy>=1.12",
    "lapx>=0.5.4",
    "motmetrics>=1.4",
    "boxmot==18.0.0",
    "trackeval>=1.3.0",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "nbstripout>=0.7",
]

[project.scripts]
tracking = "tracking.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tracking"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.per-file-ignores]
"src/tracking/cli.py" = ["B008"]
"tests/**" = ["N802", "N803"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # lenient globally
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tracking.eval.*", "tracking.data.*"]
disallow_untyped_defs = true   # strict where bugs hide

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that need real KITTI data or GPU (excluded from CI)",
]
addopts = "--cov=tracking --cov-report=term-missing -m 'not slow'"
